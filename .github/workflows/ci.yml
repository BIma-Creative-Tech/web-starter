# CI + release web-starter (Next.js 16 / Node 24, image node:24.21.0-alpine) — plan 03 task W3.
# Pola dari control-plane/.github/workflows/security.yml. Tool dijalankan sebagai container
# ter-pin tag+digest; action di-pin ke commit SHA tag rilis resmi (diverifikasi 2026-09-25 via
# GitHub API `git/ref/tags/<tag>` & `docker buildx imagetools inspect`).
#
# Image: ghcr.io/bima-creative-tech/web-starter
#   push ke main           → :sha-<12 char>
#   push tag vX.Y.Z        → :X.Y.Z + :sha-<12 char>  (tag harus = version di package.json)
# Push hanya setelah SEMUA job pemeriksaan hijau dan image lolos Trivy (HIGH/CRITICAL).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "23 2 * * 1" # Senin 02:23 UTC (09:23 WIB) — scan ulang CVE baru
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SEMGREP_IMAGE: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  NODE_VERSION: "24.21.0" # sama dengan base image Dockerfile
  NEXT_TELEMETRY_DISABLED: "1"
  IMAGE_NAME: ghcr.io/bima-creative-tech/web-starter

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # seluruh history
          persist-credentials: false
      - name: gitleaks (full history)
        run: |
          cfg=()
          if [ -f .gitleaks.toml ]; then cfg=(--config /repo/.gitleaks.toml); fi
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            git /repo "${cfg[@]}" --no-banner --redact --verbose --exit-code 1

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep scan
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src -v "$RUNNER_TEMP:/out" "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --disable-version-check \
              --config p/owasp-top-ten --config p/typescript --config p/javascript \
              --config p/react --config p/nextjs --config p/dockerfile --config p/secrets \
              --json-output=/out/semgrep.json .
      - name: gagal bila ada temuan ERROR/HIGH/CRITICAL
        run: |
          jq -r '.results[] | "\(.extra.severity)\t\(.check_id)\t\(.path):\(.start.line)"' "$RUNNER_TEMP/semgrep.json"
          n=$(jq '[.results[] | select(.extra.severity == "ERROR" or .extra.severity == "HIGH" or .extra.severity == "CRITICAL")] | length' "$RUNNER_TEMP/semgrep.json")
          echo "semgrep blocking findings: $n"
          test "$n" -eq 0

  trivy-fs:
    name: trivy-fs-config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: trivy fs (vuln package-lock.json + secret)
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/trivy-cache:/root/.cache" "$TRIVY_IMAGE" \
            fs --quiet --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src
      - name: trivy config (Dockerfile)
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/trivy-cache:/root/.cache" "$TRIVY_IMAGE" \
            config --quiet --severity HIGH,CRITICAL --exit-code 1 /src

  hadolint:
    name: hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint Dockerfile
        run: docker run --rm -i "$HADOLINT_IMAGE" hadolint --failure-threshold warning - < Dockerfile

  build-test:
    name: lint-typecheck-test-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # tanpa cache bersama (hindari cache poisoning); npm ci selalu bersih
      - run: node --version && npm --version
      - run: npm ci --no-audit --no-fund
      - name: npm audit (dependency produksi, gagal bila high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: subset ikon sinkron dengan src/components/icon-names.ts
        run: npm run icons && git diff --exit-code -- src/generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: docker-image (build + trivy + push GHCR)
    needs: [actionlint, gitleaks, semgrep, trivy-fs, hadolint, build-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # hanya job ini yang boleh push ke GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tentukan tag image
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          short="${GITHUB_SHA:0:12}"
          tags="${IMAGE_NAME}:sha-${short}"
          if [ "$REF_TYPE" = "tag" ]; then
            ver="${REF_NAME#v}"
            if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "tag bukan semver vX.Y.Z: $REF_NAME" >&2; exit 1
            fi
            pkg="$(jq -r .version package.json)"
            if [ "$pkg" != "$ver" ]; then
              echo "tag $REF_NAME ≠ package.json version $pkg" >&2; exit 1
            fi
            tags="$tags ${IMAGE_NAME}:${ver}"
          fi
          echo "local=web-starter:ci-${short}" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "tag image: $tags"
      - name: docker build
        env:
          LOCAL_TAG: ${{ steps.tags.outputs.local }}
        run: docker build --pull=false -t "$LOCAL_TAG" .
      - name: ukuran image
        env:
          LOCAL_TAG: ${{ steps.tags.outputs.local }}
        run: docker image ls "$LOCAL_TAG"
      - name: trivy image (HIGH,CRITICAL, ignore-unfixed)
        env:
          LOCAL_TAG: ${{ steps.tags.outputs.local }}
        run: |
          docker save -o "$RUNNER_TEMP/image.tar" "$LOCAL_TAG"
          docker run --rm -v "$RUNNER_TEMP:/work:ro" -v "$RUNNER_TEMP/trivy-cache:/root/.cache" "$TRIVY_IMAGE" \
            image --quiet --input /work/image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: smoke test kontrak container (read-only, uid 1001, cap_drop ALL)
        env:
          LOCAL_TAG: ${{ steps.tags.outputs.local }}
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --tmpfs /app/.next/cache \
            -u 1001:1001 --cap-drop ALL --security-opt no-new-privileges:true \
            -e SITE_URL=http://localhost -p 127.0.0.1:3000:3000 "$LOCAL_TAG"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 200
          curl -sI http://127.0.0.1:3000/ | grep -i "content-security-policy: .*'nonce-"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/contact)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/tidak-ada)" = 404
          docker rm -f smoke
      - name: push ke GHCR (hanya main / tag semver)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          LOCAL_TAG: ${{ steps.tags.outputs.local }}
          TAGS: ${{ steps.tags.outputs.tags }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for t in $TAGS; do
            docker tag "$LOCAL_TAG" "$t"
            docker push "$t"
          done
          docker logout ghcr.io
